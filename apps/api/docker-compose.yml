# Hạ tầng local cho apps/api. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: reelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelforge
      POSTGRES_PASSWORD: reelforge
      POSTGRES_DB: reelforge
    # Dùng 5433 để không đụng PostgreSQL đang chạy sẵn trên máy ở 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelforge -d reelforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: reelforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
